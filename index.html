<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog's Room</title>
  <meta name="description" content="A cozy hand-painted room starring Dog, Keeper of the Mantle.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <header class="top">
      <h1>Dog's <span>Room</span></h1>
      <p class="sub">A sunny afternoon with the Keeper of the Mantle</p>
    </header>

    <div class="screen-frame">
      <canvas id="room" class="screen" width="1600" height="900" role="img"
        aria-label="A cozy hand-painted living room on a sunny afternoon. Clouds drift past the window, curtains sway in the breeze, sunbeams light the floor, and Dog, a fluffy cream and brown cat with folded ears and big blue eyes, wanders, naps and watches the lights on the TV.">
        Dog's Room needs a browser with canvas support.
      </canvas>
      <div class="paper" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
    </div>

    <p id="caption" class="caption" aria-live="polite" aria-atomic="true"></p>
    <p class="hint">Milestone 1: sit back and watch her. Toys, the cushion and the laptop arrive next.</p>
  </main>

  <noscript><p class="hint">Dog's Room needs JavaScript. Everything runs locally; nothing is sent anywhere.</p></noscript>

  <script src="js/room.js" defer></script>
  <script src="js/dog.js" defer></script>
  <script src="js/game.js" defer></script>
</body>
</html>
